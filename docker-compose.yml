version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: projectpulse_mysql
    environment:
      MYSQL_DATABASE: projectpulse
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: projectpulse_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectpulse_backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_KEY: base64:V/tQ3oQ+W0WvD2O3D3s4b8G5a6b7c8d9e0f1a2b3c4d=
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: projectpulse
      DB_USERNAME: root
      DB_PASSWORD: secretpassword
      REDIS_HOST: redis
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: projectpulse_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    depends_on:
      - backend

volumes:
  mysql_data:
